name: Bug report
description: Something in Wavyzon doesn't work the way it should.
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't include your `WAVYZON_PASSWORD`, API credentials or any other secret. For security problems, use a private advisory instead (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Wavyzon is affected?
      options:
        - Voice (joining, silence, disconnects, DAVE)
        - Playback and mixing (crossfades, seeking, filters)
        - Sources (SoundCloud, HTTP / Icecast, local files, Deezer / Spotify / Apple Music metadata)
        - Timing (positions, TrackAudibleEvent, lyrics sync)
        - API and sessions (REST, WebSocket, resume)
        - Plugins (plugin API, a built-in plugin)
        - Analysis (fingerprints, loudness)
        - Build and deployment
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The smallest set of steps or requests that shows the problem.
      placeholder: |
        1. Load a track with ...
        2. Start a crossfade with ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant Wavyzon log lines around the problem. Remove anything private first.
      render: text
  - type: input
    id: version
    attributes:
      label: Wavyzon version
      description: The `version` from `GET /v4/info`, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How do you run it?
      options:
        - Docker image
        - Native build on Linux
        - Native build on macOS
        - Native build on Windows
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client library
      description: The Lavalink client your bot uses, with its version.
      placeholder: lavalink-client 2.10.3
  - type: input
    id: plugins
    attributes:
      label: Plugins
      description: The value of `WAVYZON_PLUGINS`, or "default".
  - type: input
    id: region
    attributes:
      label: Voice region
      description: If this is a voice problem, the region shown in the "voice session ready" log line (for example iad or mxp).
