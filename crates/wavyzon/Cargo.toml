[package]
name = "wavyzon"
description = "A standalone audio node for Discord bots, written in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "wavyzon"
# The node is shipped as a binary and Docker image, not on crates.io; this
# also lets cargo-deny accept the path dependency on the example plugin.
publish = false

[features]
default = ["plugin-example", "plugin-apo", "plugin-flowery", "plugin-genius"]
## The example plugin (`tone:` source, `bitcrush` filter, event counter and
## `/v1/plugins/example/` route).
plugin-example = ["dep:wavyzon-plugin-example"]
## Equalizer APO configurations as a playback filter (`pluginFilters.apo`,
## `/v1/plugins/apo/` routes).
plugin-apo = ["dep:wavyzon-plugin-apo"]
## Flowery text-to-speech as a source (`ftts://` identifiers, LavaSrc-compatible;
## `ftts` and `flowery-tts` in `/v4/info` `sourceManagers`).
plugin-flowery = ["dep:wavyzon-plugin-flowery"]
## Genius lyrics, asked before lyrics.ovh on `/v1/lyrics` and `/v4/lyrics`.
plugin-genius = ["dep:wavyzon-plugin-genius"]

[[bin]]
name = "wavyzon"
path = "src/main.rs"

[[bin]]
name = "livecheck"
path = "src/bin/livecheck.rs"

[dependencies]
wavyzon-plugin.workspace = true
wavyzon-audio.workspace = true
wavyzon-analysis.workspace = true
wavyzon-voice.workspace = true
wavyzon-sources.workspace = true
wavyzon-player.workspace = true
wavyzon-plugin-example = { path = "../../plugins/wavyzon-plugin-example", optional = true }
wavyzon-plugin-apo = { path = "../../plugins/wavyzon-plugin-apo", optional = true }
wavyzon-plugin-flowery = { path = "../../plugins/wavyzon-plugin-flowery", optional = true }
wavyzon-plugin-genius = { path = "../../plugins/wavyzon-plugin-genius", optional = true }

tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
reqwest.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rand.workspace = true

[dev-dependencies]
wavyzon-testkit = { path = "../wavyzon-testkit" }
tokio = { workspace = true, features = ["test-util"] }
