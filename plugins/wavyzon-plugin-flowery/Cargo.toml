[package]
name = "wavyzon-plugin-flowery"
description = "Wavyzon plugin: Flowery text-to-speech as a source (ftts:// identifiers, LavaSrc-compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
wavyzon-plugin.workspace = true
# The shared HTTP client (proxy fallback, header timeouts, redacted errors)
# and the decoder hints, so TTS audio plays like any http source.
wavyzon-sources.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
