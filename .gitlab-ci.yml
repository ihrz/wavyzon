# Wavyzon CI/CD (GitLab is the primary repository; GitHub is a push mirror).
#
# Runs on merge requests, on the default branch and on tags:
#   check   - rustfmt, clippy, cargo-deny
#   test    - unit tests + doctests, mocked integration tests (fake Discord
#             voice gateway, mock sources, whole node end to end), coverage
#   build   - release binary (kept as an artifact)
#   publish - Docker image on v* tags, GitLab Pages on the default branch

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Every pushed branch (main, feature branches...) gets a pipeline, unless it
    # has an open merge request (then the MR pipeline above covers it).
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - test
  - build
  - publish

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_DENY_VERSION: "0.20.2"
  NEXTEST_VERSION: "0.9.151"
  LLVM_COV_VERSION: "0.9.1"

# ---------------------------------------------------------------------------
# Shared Rust setup: the toolchain comes from rust-toolchain.toml (rustup
# installs it with rustfmt and clippy on first use); cmake and a C compiler
# build the static libopus.
# ---------------------------------------------------------------------------
.rust:
  image: rust:1-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake clang > /dev/null
    - rustup show active-toolchain || rustup toolchain install
    - rustc --version && cargo --version
  cache:
    key:
      files: [Cargo.lock]
      prefix: cargo-$CI_JOB_NAME_SLUG
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/
    policy: pull-push

fmt:
  stage: check
  image: rust:1-bookworm
  before_script:
    - rustup show active-toolchain || rustup toolchain install
  script:
    - cargo fmt --all --check
  cache: []

clippy:
  extends: .rust
  stage: check
  script:
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

deny:
  stage: check
  image: rust:1-bookworm
  before_script:
    - curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz --strip-components=1 -C /usr/local/bin "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
    - cargo deny --version
  script:
    - cargo deny check bans licenses sources
  cache:
    key: cargo-deny
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

# New RustSec advisories appear independently of our changes, so they are
# reported without blocking merge requests. Schedule a pipeline (e.g. daily)
# to be warned promptly.
advisories:
  extends: deny
  script:
    - cargo deny check advisories
  allow_failure: true

# Tests run with cargo-nextest (one process per test, JUnit report for the
# pipeline's "Tests" tab). Nothing here touches the network: sources, the
# Discord voice gateway and HTTP servers are mocked in-process.
.nextest:
  extends: .rust
  stage: test
  needs: []
  before_script:
    - !reference [.rust, before_script]
    - curl -fsSL "https://get.nexte.st/${NEXTEST_VERSION}/linux" | tar zxf - -C /usr/local/cargo/bin
    - cargo nextest --version
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 14 days

# Unit tests: the #[cfg(test)] modules inside every crate (DSP, mixer,
# filters, resolver, httpx, config...) plus the doctests.
unit:
  extends: .nextest
  script:
    - cargo nextest run --workspace --all-features --locked --profile ci -E 'kind(lib) | kind(bin)'
    - cargo test --workspace --all-features --locked --doc

# Mocked integration tests (crates/*/tests): a fake Discord voice gateway
# (wavyzon-testkit), mock tone sources and a real node driven over REST and
# WebSocket end to end.
mock:
  extends: .nextest
  script:
    - cargo nextest run --workspace --all-features --locked --profile ci -E 'kind(test)'

# Line coverage of the whole suite (unit + mock), shown on merge request diffs
# and as the pipeline's coverage percentage. Informational: never blocks.
coverage:
  extends: .nextest
  allow_failure: true
  before_script:
    - !reference [.nextest, before_script]
    - rustup component add llvm-tools-preview
    - curl -fsSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" | tar zxf - -C /usr/local/cargo/bin
  script:
    - cargo llvm-cov nextest --workspace --all-features --locked --profile ci --no-report
    - cargo llvm-cov report --cobertura --output-path coverage.xml
    - cargo llvm-cov report --summary-only | tee coverage-summary.txt
    # Block scalar: the command contains ": ", which a plain YAML scalar can't.
    - |
      awk '/^TOTAL/ { print "Line coverage: " $10 }' coverage-summary.txt
  coverage: '/Line coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths: [coverage-summary.txt]
    expire_in: 14 days

build-release:
  extends: .rust
  stage: build
  script:
    - cargo build --release --locked -p wavyzon
    - mkdir -p dist && cp target/release/wavyzon dist/ && cp LICENSE NOTICE dist/
    - strip dist/wavyzon || true
  artifacts:
    name: wavyzon-$CI_COMMIT_REF_SLUG-x86_64-linux
    paths: [dist/]
    expire_in: 30 days
  needs: [fmt, clippy]

# ---------------------------------------------------------------------------
# Docker image -> GitLab Container Registry, on version tags (v0.1.0, ...).
# Pushes :<version> and :latest.
# ---------------------------------------------------------------------------
docker:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
  needs: [unit, mock, clippy, deny]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker buildx create --use --name wavyzon-builder || docker buildx use wavyzon-builder
    - >
      docker buildx build
      --build-arg VERSION="$VERSION"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --cache-from type=registry,ref="$CI_REGISTRY_IMAGE:buildcache"
      --cache-to type=registry,ref="$CI_REGISTRY_IMAGE:buildcache",mode=max
      --tag "$CI_REGISTRY_IMAGE:$VERSION"
      --tag "$CI_REGISTRY_IMAGE:latest"
      --push .

# A Docker build on merge requests that touch the image, without pushing.
docker-check:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [Dockerfile, .dockerignore, Cargo.lock, .cargo/config.toml]
  needs: []
  script:
    - docker build --tag wavyzon:ci .

# ---------------------------------------------------------------------------
# GitLab Pages: landing page, the mdBook under /docs/ and the API reference
# (cargo doc) under /api/. https://wavyzon.ihorizon.org/
# ---------------------------------------------------------------------------
pages:
  extends: .rust
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: []
  variables:
    MDBOOK_VERSION: "0.5.4"
  cache:
    key:
      files: [Cargo.lock]
      prefix: cargo-$CI_JOB_NAME_SLUG
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/
      - .mdbook/
    policy: pull-push
  script:
    # mdBook, built once and kept in the cache.
    - |
      if ! .mdbook/bin/mdbook --version 2>/dev/null | grep -q "v$MDBOOK_VERSION"; then
        cargo install mdbook --version "$MDBOOK_VERSION" --locked --root .mdbook
      fi
    - .mdbook/bin/mdbook build docs --dest-dir "$CI_PROJECT_DIR/public/docs"
    - cargo doc --workspace --no-deps --all-features --locked
    - mkdir -p public/api public/assets
    - cp -r target/doc/. public/api/
    - cp assets/*.svg assets/*.png public/assets/
    - sed "s/__COMMIT__/${CI_COMMIT_SHORT_SHA}/" docs/landing/index.html > public/index.html
    - test -f public/docs/index.html && test -f public/docs/guides/pelican.html
  artifacts:
    paths: [public]
