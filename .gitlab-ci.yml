# Wavyzon CI/CD (GitLab is the primary repository; GitHub is a push mirror).
#
# Runs on merge requests, on the default branch and on tags:
#   check   - rustfmt, clippy, cargo-deny
#   test    - cargo test
#   build   - release binary (kept as an artifact)
#   publish - Docker image on v* tags, GitLab Pages on the default branch

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - test
  - build
  - publish

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_DENY_VERSION: "0.20.2"

# ---------------------------------------------------------------------------
# Shared Rust setup: the toolchain comes from rust-toolchain.toml (rustup
# installs it with rustfmt and clippy on first use); cmake and a C compiler
# build the static libopus.
# ---------------------------------------------------------------------------
.rust:
  image: rust:1-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake clang > /dev/null
    - rustup show active-toolchain || rustup toolchain install
    - rustc --version && cargo --version
  cache:
    key:
      files: [Cargo.lock]
      prefix: cargo-$CI_JOB_NAME_SLUG
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/
    policy: pull-push

fmt:
  stage: check
  image: rust:1-bookworm
  before_script:
    - rustup show active-toolchain || rustup toolchain install
  script:
    - cargo fmt --all --check
  cache: []

clippy:
  extends: .rust
  stage: check
  script:
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

deny:
  stage: check
  image: rust:1-bookworm
  before_script:
    - curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz --strip-components=1 -C /usr/local/bin "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
    - cargo deny --version
  script:
    - cargo deny check bans licenses sources
  cache:
    key: cargo-deny
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/

# New RustSec advisories appear independently of our changes, so they are
# reported without blocking merge requests. Schedule a pipeline (e.g. daily)
# to be warned promptly.
advisories:
  extends: deny
  script:
    - cargo deny check advisories
  allow_failure: true

test:
  extends: .rust
  stage: test
  script:
    - cargo test --workspace --all-features --locked
  needs: []

build-release:
  extends: .rust
  stage: build
  script:
    - cargo build --release --locked -p wavyzon
    - mkdir -p dist && cp target/release/wavyzon dist/ && cp LICENSE NOTICE dist/
    - strip dist/wavyzon || true
  artifacts:
    name: wavyzon-$CI_COMMIT_REF_SLUG-x86_64-linux
    paths: [dist/]
    expire_in: 30 days
  needs: [fmt, clippy]

# ---------------------------------------------------------------------------
# Docker image -> GitLab Container Registry, on version tags (v0.1.0, ...).
# Pushes :<version> and :latest.
# ---------------------------------------------------------------------------
docker:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/
  needs: [test, clippy, deny]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker buildx create --use --name wavyzon-builder || docker buildx use wavyzon-builder
    - >
      docker buildx build
      --build-arg VERSION="$VERSION"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --cache-from type=registry,ref="$CI_REGISTRY_IMAGE:buildcache"
      --cache-to type=registry,ref="$CI_REGISTRY_IMAGE:buildcache",mode=max
      --tag "$CI_REGISTRY_IMAGE:$VERSION"
      --tag "$CI_REGISTRY_IMAGE:latest"
      --push .

# A Docker build on merge requests that touch the image, without pushing.
docker-check:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [Dockerfile, .dockerignore, Cargo.lock, .cargo/config.toml]
  needs: []
  script:
    - docker build --tag wavyzon:ci .

# ---------------------------------------------------------------------------
# GitLab Pages: API reference (cargo doc) under /api/ and docs/ rendered to
# HTML under /docs/. https://ihrz.gitlab.io/wavyzon/
# ---------------------------------------------------------------------------
pages:
  extends: .rust
  stage: publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: []
  script:
    - apt-get install -y -qq --no-install-recommends pandoc > /dev/null
    - cargo doc --workspace --no-deps --all-features --locked
    - mkdir -p public/api public/docs public/assets
    - cp -r target/doc/. public/api/
    - cp assets/*.svg assets/*.png public/assets/
    - |
      # Render every Markdown file in docs/ (keeping the folder layout), and
      # rewrite links between them from .md to .html.
      cat > /tmp/md-links.lua <<'LUA'
      function Link(l)
        if not l.target:match("^%a[%w+.-]*:") then
          l.target = l.target:gsub("%.md$", ".html"):gsub("%.md#", ".html#")
        end
        return l
      end
      LUA
      if [ -d docs ]; then
        find docs -type f ! -name '*.md' -exec sh -c 'mkdir -p "public/$(dirname "$1")" && cp "$1" "public/$1"' _ {} \;
        find docs -type f -name '*.md' | while read -r f; do
          out="public/${f%.md}.html"
          mkdir -p "$(dirname "$out")"
          title="$(grep -m1 '^# ' "$f" | sed 's/^# //')"
          pandoc "$f" --from gfm --to html5 --standalone \
            --metadata title="${title:-Wavyzon}" --metadata pagetitle="${title:-Wavyzon} - Wavyzon" \
            --lua-filter=/tmp/md-links.lua \
            --output "$out"
        done
        [ -f public/docs/README.html ] && [ ! -f public/docs/index.html ] && cp public/docs/README.html public/docs/index.html || true
      fi
    - |
      cat > public/index.html <<HTML
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Wavyzon</title>
        <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
        <style>
          :root { color-scheme: light dark; --bg:#F6F5FF; --fg:#0D0B1A; --muted:#5B5675; --accent:#7C5CFF; }
          @media (prefers-color-scheme: dark) { :root { --bg:#0D0B1A; --fg:#F6F5FF; --muted:#A8A3C7; --accent:#22D3EE; } }
          body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
          main { max-width:960px; margin:0 auto; padding:32px 16px; }
          img { max-width:100%; height:auto; border-radius:12px; }
          a { color:var(--accent); } p { color:var(--muted); }
          ul { padding-left:20px; }
        </style>
      </head>
      <body><main>
        <img src="assets/banner.svg" alt="Wavyzon: a standalone audio node for Discord bots, written in Rust">
        <ul>
          <li><a href="docs/">Documentation</a></li>
          <li><a href="api/wavyzon_plugin/">Plugin API reference</a> (<a href="api/">all crates</a>)</li>
          <li><a href="https://gitlab.com/ihrz/wavyzon">Source on GitLab</a> &middot; <a href="https://github.com/ihrz/wavyzon">GitHub mirror</a></li>
        </ul>
        <p>Built from ${CI_COMMIT_SHORT_SHA}. Licensed under CC BY-NC-SA 4.0.</p>
      </main></body>
      </html>
      HTML
  artifacts:
    paths: [public]
